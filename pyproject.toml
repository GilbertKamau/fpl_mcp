[project]
name = "fpl-mcp"
version = "0.1.0"
description = "MCP server for Fantasy Premier League data, predictions and squad advice"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilbert Kamau" }]
keywords = ["fpl", "fantasy-premier-league", "mcp", "model-context-protocol", "football"]
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "lightgbm>=4.0",
    "pulp>=3.0",
    "highspy>=1.7",
]

[project.urls]
Repository = "https://github.com/GilbertKamau/fpl_mcp"

[project.optional-dependencies]
supabase = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
fpl-mcp = "fpl_mcp.server:main"
fpl-sync = "fpl_mcp.ingest:main"
fpl-model = "fpl_mcp.model:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
