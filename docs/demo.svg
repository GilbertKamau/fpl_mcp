<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="Example: an AI assistant answering two FPL questions using fpl-mcp tools">
  <title>fpl-mcp example answers</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .muted { fill: #5b6472; font-size: 13px; }
    .q { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .tool { fill: #3f6b4a; font-size: 12.5px; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .h { fill: #5b6472; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
    .c { fill: #17202b; font-size: 14px; }
    .b { fill: #17202b; font-size: 14px; font-weight: 600; }
    .n { fill: #17202b; font-size: 14px; font-variant-numeric: tabular-nums; }
  </style>

  <rect x="0" y="0" width="760" height="560" rx="14" fill="#f6f7f9"/>
  <rect x="0.5" y="0.5" width="759" height="559" rx="14" fill="none" stroke="#d9dde3"/>

  <!-- Question 1 -->
  <rect x="300" y="24" width="436" height="40" rx="20" fill="#37003c"/>
  <text x="320" y="49" class="q">Best midfielders under £7m for the next 3 gameweeks?</text>

  <text x="24" y="92" class="tool">predict_points(position="MID", max_price=7.0, gameweeks=3)</text>
  <rect x="24" y="104" width="712" height="182" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
  <text x="44" y="128" class="h">PLAYER</text>
  <text x="250" y="128" class="h">PRICE</text>
  <text x="340" y="128" class="h">GW7</text>
  <text x="420" y="128" class="h">GW8</text>
  <text x="500" y="128" class="h">GW9</text>
  <text x="600" y="128" class="h">TOTAL</text>
  <line x1="44" y1="138" x2="716" y2="138" stroke="#e3e6ea"/>

  <text x="44" y="162" class="b">Groß</text><text x="102" y="162" class="muted">BHA</text>
  <text x="250" y="162" class="n">£5.9m</text><text x="340" y="162" class="n">5.08</text><text x="420" y="162" class="n">4.79</text><text x="500" y="162" class="n">4.12</text><text x="600" y="162" class="b">13.99</text>
  <text x="44" y="190" class="c">Le Fée</text><text x="102" y="190" class="muted">SUN</text>
  <text x="250" y="190" class="n">£5.7m</text><text x="340" y="190" class="n">3.87</text><text x="420" y="190" class="n">4.18</text><text x="500" y="190" class="n">4.76</text><text x="600" y="190" class="b">12.81</text>
  <text x="44" y="218" class="c">Dewsbury-Hall</text><text x="148" y="218" class="muted">EVE</text>
  <text x="250" y="218" class="n">£6.6m</text><text x="340" y="218" class="n">4.24</text><text x="420" y="218" class="n">3.83</text><text x="500" y="218" class="n">4.71</text><text x="600" y="218" class="b">12.78</text>
  <text x="44" y="246" class="c">Anderson</text><text x="114" y="246" class="muted">MCI</text>
  <text x="250" y="246" class="n">£6.3m</text><text x="340" y="246" class="n">4.02</text><text x="420" y="246" class="n">4.56</text><text x="500" y="246" class="n">3.80</text><text x="600" y="246" class="b">12.38</text>
  <text x="44" y="274" class="c">Neto</text><text x="84" y="274" class="muted">CHE</text>
  <text x="250" y="274" class="n">£6.5m</text><text x="340" y="274" class="n">3.46</text><text x="420" y="274" class="n">4.17</text><text x="500" y="274" class="n">3.95</text><text x="600" y="274" class="b">11.58</text>

  <!-- Question 2 -->
  <rect x="422" y="312" width="314" height="40" rx="20" fill="#37003c"/>
  <text x="442" y="337" class="q">Who are the best captains for GW7?</text>

  <text x="24" y="380" class="tool">predict_points(gameweeks=1, limit=4)</text>
  <rect x="24" y="392" width="712" height="128" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
  <text x="44" y="420" class="b">1. Haaland</text><text x="132" y="420" class="muted">MCI · LIV (A)</text><text x="600" y="420" class="b">5.67 pts</text>
  <text x="44" y="446" class="c">2. Groß</text><text x="108" y="446" class="muted">BHA · CRY (H)</text><text x="600" y="446" class="n">5.08 pts</text>
  <text x="44" y="472" class="c">3. João Pedro</text><text x="148" y="472" class="muted">CHE · EVE (A)</text><text x="600" y="472" class="n">5.01 pts</text>
  <text x="44" y="498" class="c">4. De Cuyper</text><text x="138" y="498" class="muted">BHA · CRY (H)</text><text x="600" y="498" class="n">4.99 pts</text>

  <text x="24" y="545" class="muted">Expected points from the model, before GW7 of 2026/27. Injury news already applied.</text>
</svg>
