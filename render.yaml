# Render blueprint: New > Blueprint > pick this repo. Set the secrets when prompted.
services:
  - type: web
    name: fpl-mcp
    runtime: docker
    plan: free  # sleeps after ~15 min idle; the first request after that takes ~1 min
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase Session pooler URI, ideally for the read-only role (scripts/supabase_readonly_role.sql)
      - key: MCP_AUTH_TOKEN
        sync: false  # optional; leave empty for claude.ai / ChatGPT, which can't send a fixed token
